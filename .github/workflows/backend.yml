name: Backend security checks
on:
  pull_request:
    paths: ['server/**', 'security-tests/**', 'firestore*', 'storage.rules', 'firebase.json', 'gradle/**', '.github/workflows/backend.yml']
  push:
    branches: [master]
    paths: ['server/**', 'security-tests/**', 'firestore*', 'storage.rules', 'firebase.json', 'gradle/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: security-tests/package-lock.json
      - run: chmod +x gradlew
      - run: ./gradlew -p server test installDist --no-daemon
      - run: npm ci --ignore-scripts
        working-directory: security-tests
      - run: npm test
        working-directory: security-tests
